name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: ruff check main.py src tests

      - name: Test
        run: python -m pytest -q

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm PyManager.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PyManager-windows
          path: dist/PyManager.exe
          if-no-files-found: error
          retention-days: 14

  publish-continuous:
    name: Publish continuous build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: PyManager-windows
          path: release

      - name: Update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated Windows build from commit ${GITHUB_SHA}. This prerelease is replaced after every successful push to main."
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit continuous \
              --repo "$GITHUB_REPOSITORY" \
              --title "PyManager Continuous Build" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
            gh release upload continuous release/PyManager.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create continuous release/PyManager.exe \
              --repo "$GITHUB_REPOSITORY" \
              --title "PyManager Continuous Build" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi
